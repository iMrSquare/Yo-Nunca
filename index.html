<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- PWA: Android / Chrome (Safari 26+ ignora esto: tiñe con el background-color de <body>, ver index.css) -->
    <meta name="theme-color" content="#1c0c33" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- PWA: iOS / Safari (no lee el manifest, necesita estas etiquetas aparte) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Yo Nunca" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Yo Nunca</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Manrope:wght@400;500;600;700&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      Franjas de referencia de color para Safari 26+ (iOS "Liquid Glass"):
      tiñe la barra de estado y la zona del indicador de inicio leyendo el
      background-color de elementos position:fixed pegados a cada borde,
      no de un único color plano. Como nuestro degradado es más claro arriba
      y más oscuro abajo, le damos un color de referencia distinto a cada
      lado para que no se note la costura. No son visibles ni interactivas.
    -->
    <div class="yn-safe-tint yn-safe-tint-top"></div>
    <div class="yn-safe-tint yn-safe-tint-bottom"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
